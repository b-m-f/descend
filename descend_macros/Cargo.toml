[package]
name = "descend_macros"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true


[dependencies]
syn = { version = "1.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
descend = { path = "../" }
cudarc = { version = "0.19.9", default-features = false, features = ["nvrtc", "std", "dynamic-linking", "cuda-version-from-build-system"] }
