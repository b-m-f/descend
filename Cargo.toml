[package]
name = "descend"
version = "0.1.0"
authors = ["Köpcke <bastian.koepcke@uni-muenster.de>"]
edition = "2021"

[[bin]]
name = "descendc"
path = "src/main.rs"



[dependencies]
syn = { version = "3.0.3", features = ["full"] }



# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.peg]
version = "0.8.0"

[dependencies.annotate-snippets]
version = "0.9.0"
features = ["color"]

[dependencies.descend_derive]
path = "./descend_derive"

[dependencies.libloading]
version = "0.8"

[dev-dependencies.descend_macros]
path = "./descend_macros"

[dev-dependencies.descend_host]
path = "./descend_host"

[dev-dependencies.cuda-core]
git = "https://github.com/NVlabs/cuda-oxide.git"

[dev-dependencies.cuda-bindings]
git = "https://github.com/NVlabs/cuda-oxide.git"

[dev-dependencies.trybuild]
version = "1.0"

[workspace]
members = ["descend_derive", "descend_macros", "descend_host"]
